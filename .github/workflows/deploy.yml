name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/funny-carson-keMRz
  schedule:
    - cron: '0 2 1 * *'   # 매월 1일 02:00 UTC 자동 실행
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: HIRA API 연결 진단
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/test-hira-api.js
        continue-on-error: true

      - name: HIRA API 약가 최신화
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/fetch-hira-prices.js
        continue-on-error: true

      - name: 약가 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet src/data/drugs.js src/data/allGenerics.js src/data/apiMeta.js; then
            git add src/data/drugs.js src/data/allGenerics.js src/data/apiMeta.js
            git commit -m "chore: HIRA 약가 자동 업데이트 $(date -u '+%Y-%m-%d')"
            git push
          else
            echo "변경사항 없음 — 커밋 생략"
          fi
        continue-on-error: true

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
