name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/funny-carson-keMRz
  schedule:
    - cron: '0 2 1 * *'   # 매월 1일 02:00 UTC 자동 실행
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 변경 파일 비교(git diff)용 전체 이력

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 페치 실행 여부 판단: 스케줄/수동 실행이거나 페치 스크립트가 바뀐 푸시에만 API 최신화.
      # 프론트엔드/데이터-only 커밋은 페치(~8분) 건너뛰고 바로 빌드·배포.
      - name: 페치 필요 여부 판단
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "run_fetch=true" >> "$GITHUB_OUTPUT"   # schedule / workflow_dispatch → 항상 페치
            echo "→ ${{ github.event_name }} 이벤트: 페치 실행"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "run_fetch=true" >> "$GITHUB_OUTPUT"   # 비교 대상 없음(최초 푸시 등) → 안전하게 페치
            echo "→ 이전 커밋 불명: 페치 실행"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          echo "변경 파일:"; echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^scripts/(fetch-hira-prices|test-hira-api)\.js$'; then
            echo "run_fetch=true" >> "$GITHUB_OUTPUT"
            echo "→ 페치 스크립트 변경 감지: 페치 실행"
          else
            echo "run_fetch=false" >> "$GITHUB_OUTPUT"
            echo "→ 프론트엔드/데이터-only: 페치 건너뜀"
          fi

      - name: HIRA API 연결 진단
        if: steps.changes.outputs.run_fetch == 'true'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/test-hira-api.js
        continue-on-error: true

      - name: HIRA API 약가 최신화
        if: steps.changes.outputs.run_fetch == 'true'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/fetch-hira-prices.js
        continue-on-error: true

      - name: 약가 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet src/data/drugs.js src/data/allGenerics.js src/data/apiMeta.js; then
            git add src/data/drugs.js src/data/allGenerics.js src/data/apiMeta.js
            git commit -m "chore: HIRA 약가 자동 업데이트 $(date -u '+%Y-%m-%d')"
            git push
          else
            echo "변경사항 없음 — 커밋 생략"
          fi
        continue-on-error: true

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
