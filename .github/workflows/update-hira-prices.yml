name: HIRA 약가 자동 업데이트

# 월간 자동 갱신은 deploy.yml(매월 1일 스케줄)이 단독으로 담당한다.
# 이 워크플로는 수동 실행(workflow_dispatch) 전용 — 스케줄 중복/경합 및
# apiMeta.js 미커밋으로 인한 '갱신 시각' 정체 문제를 피하기 위함.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/funny-carson-keMRz
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: HIRA API 약가 조회 및 데이터 업데이트
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/fetch-hira-prices.js

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/allGenerics.js src/data/drugs.js src/data/apiMeta.js
          if git diff --cached --quiet; then
            echo "변경사항 없음 — 약가 최신 상태"
          else
            MONTH=$(date '+%Y년 %m월')
            git commit -m "HIRA 약가 자동 업데이트 (${MONTH})"
            git push origin claude/funny-carson-keMRz
            echo "✅ 푸시 완료 — GitHub Pages 배포 시작"
          fi
