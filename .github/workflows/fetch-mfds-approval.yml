name: 식약처 허가사항 원문 업데이트

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/funny-carson-keMRz
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 식약처 원문 조회 및 drugs.js 업데이트
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/fetch-and-update.js

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/drugs.js
          if git diff --cached --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "식약처 허가사항 원문 자동 업데이트 (data.go.kr API)"
            git push origin claude/funny-carson-keMRz
            echo "✅ 푸시 완료 — GitHub Pages 배포 시작"
          fi
